<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Game heading -->
    <nav>
        <h2>Tic Tac Toe Arena</h2>
    </nav>

    <!-- Select game mode -->
    <div class="mode-container">
        <label for="modeSelect">Game Mode:</label>
        <select id="modeSelect">
            <option value="friend">Play with Friend</option>
            <option value="computer">Play with Computer</option>
        </select>
    </div>

    <!-- Main game area -->
    <div class="gameContainer">

        <div class="twocontainer">

            <!-- Tic Tac Toe board -->
            <div class="container">

                <div class="line"></div>

                <div class="box bt-0 bl-0">
                    <span class="boxtext"></span>
                </div>

                <div class="box bt-0">
                    <span class="boxtext"></span>
                </div>

                <div class="box bt-0 br-0">
                    <span class="boxtext"></span>
                </div>

                <div class="box bl-0">
                    <span class="boxtext"></span>
                </div>

                <div class="box">
                    <span class="boxtext"></span>
                </div>

                <div class="box br-0">
                    <span class="boxtext"></span>
                </div>

                <div class="box bl-0 bb-0">
                    <span class="boxtext"></span>
                </div>

                <div class="box bb-0">
                    <span class="boxtext"></span>
                </div>

                <div class="box bb-0 br-0">
                    <span class="boxtext"></span>
                </div>

            </div>
        </div>

        <!-- Game information -->
        <div class="gameInfo">

            <h1>Let the Game Begin</h1>

            <div>
                <span class="info">Turn for X</span>
                <button id="reset">Reset</button>
            </div>

            <div class="imgbox">
                <img src="excited.gif" alt="">
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
